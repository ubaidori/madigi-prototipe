<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAdigi Prototype</title>
  <link rel="stylesheet" href="./dist/output.css" />
</head>
<body class="min-h-screen bg-white text-gray-900">
  <main class="flex min-h-screen items-center justify-center px-6">
    <section class="w-full max-w-[420px]">
      <div class="flex flex-col items-center text-center">
        <div class="mb-5 flex h-11 w-11 items-center justify-center rounded-full bg-madigi-soft ring-2 ring-madigi-green/20">
          <span class="text-sm font-bold text-madigi-dark">MA</span>
        </div>

        <h1 class="text-3xl font-semibold tracking-tight text-gray-900">
          Log in
        </h1>

        <p class="mt-3 text-base text-gray-500">
          Masukkan email dan password di bawah ini
        </p>
      </div>

      <form id="loginForm" class="mt-8 space-y-6">
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-gray-800">
            Email
          </label>
          <input
            id="email"
            type="email"
            placeholder="email@example.com"
            class="h-12 w-full rounded-lg border border-gray-300 px-4 text-base text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-madigi-green focus:ring-4 focus:ring-madigi-green/10"
          />
        </div>

        <div>
          <label for="password" class="mb-2 block text-sm font-medium text-gray-800">
            Password
          </label>
          <input
            id="password"
            type="password"
            placeholder="Password"
            class="h-12 w-full rounded-lg border border-gray-300 px-4 text-base text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-madigi-green focus:ring-4 focus:ring-madigi-green/10"
          />
        </div>

        <button
          type="submit"
          class="h-12 w-full rounded-lg bg-madigi-green text-base font-semibold text-white transition hover:bg-madigi-dark focus:outline-none focus:ring-4 focus:ring-madigi-green/20"
        >
          Log in
        </button>
      </form>

      <p class="mt-6 text-center text-xs text-gray-400">
        Prototype UX MAdigi - data dan login hanya simulasi.
      </p>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
